<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>__TITLE__</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#172033;background:#f4f6fa}body{margin:0}main{max-width:960px;margin:auto;padding:24px}.toolbar,.card{background:#fff;border:1px solid #dce2ec;border-radius:14px;padding:18px;margin-bottom:16px}.toolbar{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:center}.count{margin-left:auto}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mode{border:1px solid #cbd4e2;border-radius:10px;padding:12px}.mode.selected{border-color:#2457d6;background:#edf3ff}button{border:0;border-radius:8px;padding:10px 14px;background:#2457d6;color:#fff;cursor:pointer}button.secondary{background:#e8edf5;color:#172033}textarea{box-sizing:border-box;width:100%;min-height:76px;margin-top:6px;border:1px solid #cbd4e2;border-radius:8px;padding:9px}.captions{padding:10px;background:#f7f8fb;border-radius:8px}.error{color:#b42318}.ok{color:#137333}@media(max-width:760px){.modes{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}}
  </style>
</head>
<body><main>
  <div class="toolbar"><strong>__TITLE__</strong><span id="status">尚未保存</span><span class="count" id="count"></span><button class="secondary" id="save">保存</button><button id="export">完成审批并导出 JSON</button><a id="download-link" hidden>备用下载 JSON</a></div>
  <details id="json-fallback" hidden class="card"><summary>下载受限时手动保存 JSON</summary><p>若浏览器没有生成文件，请复制下方完整内容并以 UTF-8 保存为 <code>p04-decisions.json</code>。</p><textarea id="json-output" readonly></textarea></details>
  <div id="cards"></div>
</main>
<script>
const MATRIX=__MATRIX_JSON__;
const STORAGE_KEY=`evg-p04-review:${MATRIX.matrix_sha256}`;
const MODE_NAMES={V1_PRESENTER_FULL:'人物全屏',V2_PRESENTER_OVERLAY:'人物全屏＋轻提示',V3_ANIMATION_WITH_PIP:'主动画＋人物小窗'};
let state={};let exportUrl='';
function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function initial(){for(const item of MATRIX.candidates){const mode=item.user_selected_mode==='PENDING'?item.mode_recommendation:item.user_selected_mode;state[item.id]={selected_mode:mode,final_screen_text:item.mode_options[mode].screen_text||'',final_visual_expression:item.mode_options[mode].visual_structure||'',user_notes:''};}}
function restore(){initial();try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(saved&&saved.matrix_sha256===MATRIX.matrix_sha256)state={...state,...saved.state};document.querySelector('#status').textContent=saved?'已恢复本地保存':'尚未保存';}catch(error){document.querySelector('#status').textContent=`恢复失败：${error.message}`;document.querySelector('#status').className='error';}}
function render(){const root=document.querySelector('#cards');root.innerHTML='';for(const item of MATRIX.candidates){const decision=state[item.id];const card=document.createElement('section');card.className='card';const captions=item.final_caption_refs.map(x=>`<div>${escapeHtml(x.text)}</div>`).join('');const modes=Object.entries(item.mode_options).map(([mode,opt])=>`<div class="mode ${decision.selected_mode===mode?'selected':''}" data-mode="${mode}"><label><input type="radio" name="${item.id}" value="${mode}" ${decision.selected_mode===mode?'checked':''}> <strong>${escapeHtml(opt.natural_name||MODE_NAMES[mode])}</strong></label><p>${escapeHtml(opt.purpose)}</p><p><b>屏幕文字：</b>${escapeHtml(opt.screen_text||'无额外屏幕文字')}</p><p><b>视觉结构：</b>${escapeHtml(opt.visual_structure)}</p><p><b>出现与变化：</b>${escapeHtml(opt.appearance_sequence)}</p><p><b>布局避让：</b>${escapeHtml(opt.layout_and_avoidance)}</p><p><b>时间：</b>${escapeHtml(opt.timing_feasibility)} · ${escapeHtml(opt.timing_evidence)}</p></div>`).join('');card.innerHTML=`<h2>${escapeHtml(item.id)} · ${item.start_seconds.toFixed(3)}–${item.end_seconds.toFixed(3)}s</h2><p><b>认知任务：</b>${escapeHtml(item.cognitive_task)}</p><p><b>切片理由：</b>${escapeHtml(item.boundary_reason)}</p><div class="captions"><b>最终字幕</b>${captions}</div><p><b>Agent 推荐：</b>${escapeHtml(MODE_NAMES[item.mode_recommendation])} — ${escapeHtml(item.mode_recommendation_reason)}</p><div class="modes">${modes}</div><label>最终屏幕文字<textarea data-field="final_screen_text">${escapeHtml(decision.final_screen_text)}</textarea></label><label>最终视觉表达<textarea data-field="final_visual_expression">${escapeHtml(decision.final_visual_expression)}</textarea></label><label>用户备注<textarea data-field="user_notes">${escapeHtml(decision.user_notes)}</textarea></label>`;card.addEventListener('change',e=>{if(e.target.matches('input[type=radio]')){const mode=e.target.value;decision.selected_mode=mode;decision.final_screen_text=item.mode_options[mode].screen_text||'';decision.final_visual_expression=item.mode_options[mode].visual_structure||'';render();save();}});card.addEventListener('input',e=>{const field=e.target.dataset.field;if(field)decision[field]=e.target.value;updateCount();});root.appendChild(card);}updateCount();}
function incomplete(){return MATRIX.candidates.filter(item=>{const d=state[item.id];return !d||!d.selected_mode||!d.final_visual_expression.trim();});}
function updateCount(){const items=incomplete();document.querySelector('#count').textContent=`未完成 ${items.length} 项`;}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({matrix_sha256:MATRIX.matrix_sha256,state}));const node=document.querySelector('#status');node.textContent='已保存到本地';node.className='ok';return true;}catch(error){const node=document.querySelector('#status');node.textContent=`保存失败：${error.message}。请立即导出 JSON。`;node.className='error';return false;}}
function exportDecisions(){save();const missing=incomplete();if(missing.length){missing[0]&&document.querySelectorAll('.card')[MATRIX.candidates.indexOf(missing[0])].scrollIntoView({behavior:'smooth'});alert(`仍有 ${missing.length} 项未完成，不能导出。`);return;}const payload={schema_version:'1.0',candidate_matrix_version:MATRIX.schema_version,candidate_matrix_sha256:MATRIX.matrix_sha256,decisions:MATRIX.candidates.map(item=>({segment_id:item.id,...state[item.id]})),exported_at:new Date().toISOString()};const json=JSON.stringify(payload,null,2)+'\n';if(exportUrl)URL.revokeObjectURL(exportUrl);exportUrl=URL.createObjectURL(new Blob([json],{type:'application/json;charset=utf-8'}));const link=document.querySelector('#download-link');link.href=exportUrl;link.download='p04-decisions.json';link.hidden=false;document.querySelector('#json-output').value=json;document.querySelector('#json-fallback').hidden=false;link.click();document.querySelector('#status').textContent='已生成 JSON 并请求下载；请确认磁盘文件，未下载则点备用链接';}
document.querySelector('#save').addEventListener('click',save);document.querySelector('#export').addEventListener('click',exportDecisions);restore();render();
window.addEventListener('beforeunload',()=>{if(exportUrl)URL.revokeObjectURL(exportUrl);});
</script></body></html>
